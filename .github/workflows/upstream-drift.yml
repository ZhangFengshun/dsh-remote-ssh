name: upstream-drift

# 上游 dsh-better-sidebar 每发一版都可能带来**新端点**。本插件用 kind:"exact" 逐个接管它的路由，
# 漏接一个就会让"远程项目里看到的是本地文件 / 写到错位置"这类静默失效回归 —— issue #26（本地绝对
# 路径被推到远端）和 #27（空路径被误判 400）都是这么冒出来的。
#
# 所以这条流水线每周用 @latest 跑一遍全量断言：上游一旦新增端点，对拍断言会红，
# 提醒做一件固定动作（见 MAINTENANCE「升级 better-sidebar 后必做对拍」）：
#   1. tar -xzf 上游新包，按 lib/index.js 里的路由/分发找出新增项；
#   2. 在 lib/index.js 里接管（exact 路由 + 两个分支）；
#   3. 在 tests/ 补对拍断言，然后跑 node tests/run-all.mjs。
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装上上游最新版
        shell: pwsh
        run: |
          $ver = (npm view dsh-better-sidebar@latest version).Trim()
          $dst = Join-Path $env:USERPROFILE '.dsh\profiles\desktop\node_modules'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          npm pack "dsh-better-sidebar@$ver" --pack-destination $env:RUNNER_TEMP
          tar -xzf (Join-Path $env:RUNNER_TEMP "dsh-better-sidebar-$ver.tgz") -C $env:RUNNER_TEMP
          Move-Item (Join-Path $env:RUNNER_TEMP 'package') (Join-Path $dst 'dsh-better-sidebar')
          Write-Host "::notice title=上游版本::$ver"

      - name: 全量测试（对拍上游最新版）
        run: npm test
