name: tests

# 每次 push / PR 都在 Windows 上跑全量断言。
# 为什么是 windows-latest 而不是 ubuntu：本仓测试是按 Windows 语义写的（盘符判定、USERPROFILE、
# 路径分隔符），而"远端是 GNU userland"的部分都走 faked SSH（测试里自己拼命令断言），不需要真主机。
#
# 上游对拍用的是**钉住的**版本，保证同一份提交永远得到同一结果；
# 上游有没有漂移由 upstream-drift.yml 每周单独盯（那份用 @latest）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 有一批断言是"与**实际安装的** better-sidebar 对拍"（注册端点是否覆盖上游全部路由）。
      # 本机没有这个包时它们会自动跳过（1469 → 1465），CI 里我们把它装上，让对拍真正生效。
      - name: 装上游 better-sidebar（钉版本，供对拍断言）
        shell: pwsh
        run: |
          $ver = '0.26.1'
          $dst = Join-Path $env:USERPROFILE '.dsh\profiles\desktop\node_modules'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          npm pack "dsh-better-sidebar@$ver" --pack-destination $env:RUNNER_TEMP
          tar -xzf (Join-Path $env:RUNNER_TEMP "dsh-better-sidebar-$ver.tgz") -C $env:RUNNER_TEMP
          Move-Item (Join-Path $env:RUNNER_TEMP 'package') (Join-Path $dst 'dsh-better-sidebar')
          Write-Host ("对拍用上游版本 = " + (Get-Content (Join-Path $dst 'dsh-better-sidebar\package.json') -Raw | ConvertFrom-Json).version)

      - name: 全量测试
        run: npm test
